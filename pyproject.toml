[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cascadegateway"
version = "2.0.0"
description = "Hardware-adaptive local LLM & cloud cascading gateway with Architect & Builder pipeline."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "pystray>=0.19.5",
    "pillow>=10.4.0",
]

[project.scripts]
cascade-gateway = "cascadegateway.api.server:main"
cascade-tray = "cascadegateway.tray.app:main"
cascade-mcp = "cascadegateway.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
